name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-gcc-10:
    name: GCC 10
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 10
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-10 g++-10

      - name: Compiler version
        run: gcc-10 --version

      - name: Build
        run: make rebuild CC=gcc-10